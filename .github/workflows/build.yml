name: Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build with Xcode 26
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project CommunitySource2026.xcodeproj \
            -scheme CommunitySource2026 \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            clean build
